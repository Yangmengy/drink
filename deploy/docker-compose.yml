services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80"
      - "${WEB_BIND:-0.0.0.0}:${WEB_TLS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./certs/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: drink
    volumes:
      - drink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drink -d drink"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/yangmengy/drink-server:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://drink:${POSTGRES_PASSWORD}@db:5432/drink
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      OPS_OWNER_EMAIL: ${OPS_OWNER_EMAIL:-}
    # 不映射端口到宿主机，Nginx 通过 Docker 内部网络访问

volumes:
  drink-postgres:
