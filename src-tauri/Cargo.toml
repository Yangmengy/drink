[package]
name = "cocktail-app"
version = "0.2.0"
description = "A local personal companion bartender powered by ADK"
authors = ["yangmengying"]
edition = "2021"
default-run = "cocktail-app"

[lib]
name = "cocktail_app_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
dirs = "5"
# ADK remains the companion Agent runtime; only the used capabilities are enabled.
adk-rust = { path = "../adk-rust/adk-rust", features = ["agents", "openai", "tools", "sessions", "runner"], default-features = false }
adk-session = { path = "../adk-rust/adk-session", features = ["sqlite"] }
schemars = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
