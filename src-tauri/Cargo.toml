[package]
name = "cocktail-app"
version = "0.1.0"
description = "A cocktail recipe management app"
authors = ["yangmengying"]
edition = "2021"
default-run = "cocktail-app"

[lib]
name = "cocktail_app_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
base64 = "0.22.1"
# 精简版 adk-rust: 只包含 AI 对话所需的核心功能
# - agents: AI 代理核心
# - openai: OpenAI API 支持
# - sessions: 会话管理（用于聊天历史）
# - memory: 记忆功能（用于上下文记忆）
# - sqlite-memory: SQLite 内存存储
# - runner: Runner 运行器（用于执行 agent）
adk-rust = { path = "../adk-rust/adk-rust", features = ["agents", "openai", "sessions", "memory", "sqlite-memory", "runner"], default-features = false }
adk-session = { path = "../adk-rust/adk-session", features = ["sqlite"] }
adk-memory = { path = "../adk-rust/adk-memory", features = ["sqlite-memory"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[[bin]]
name = "import_data"
path = "src/bin/import_data.rs"
