name: Server build and deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/drink-server
  SERVER_HOST: 47.104.88.207
  SERVER_USER: root
  SERVER_DIR: /opt/drink/deploy

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: drink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d drink_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check --manifest-path server/Cargo.toml
      - run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/drink_test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sync dist to server
        timeout-minutes: 5
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          tar -C dist -czf /tmp/dist.tar.gz .
          scp -i ~/.ssh/deploy_key /tmp/dist.tar.gz ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/
          ssh -i ~/.ssh/deploy_key ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          exec 9>/tmp/drink-frontend-deploy.lock
          flock -w 120 9
          rm -rf /opt/drink/deploy/html/*
          tar -C /opt/drink/deploy/html -xzf /tmp/dist.tar.gz
          rm /tmp/dist.tar.gz
          REMOTE

  deploy-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: server-backend-deploy
      cancel-in-progress: false
    steps:
      - name: Pull and restart API container
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          exec 9>/tmp/drink-backend-deploy.lock
          flock -w 1200 9
          cd /opt/drink/deploy
          docker compose pull api
          for attempt in 1 2 3 4 5; do
            if docker compose up -d api; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "API container recreate failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error http://127.0.0.1/api/ready; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "API readiness check failed" >&2
          exit 1
          REMOTE
